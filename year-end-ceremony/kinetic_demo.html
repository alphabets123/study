<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>키네틱 모션그래픽 데모 (Kinetic Typography Showcase)</title>
  
  <!-- Google Fonts: 압도적인 볼드 타이포그래피 & 럭셔리 세리프 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Cinzel:wght@800;900&family=Montserrat:ital,wght@0,800;0,900;1,900&family=Noto+Sans+KR:wght@700;900&family=Syne:wght@800&display=swap" rel="stylesheet">
  
  <!-- GSAP Animation Core -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    :root {
      --gold-bright: #fff2be;
      --gold-primary: #f2c94c;
      --gold-deep: #b38728;
      --accent-red: #ff334b;
      --bg-dark: #03050c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: 'Montserrat', 'Noto Sans KR', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* 화면 전체 컨테이너 (카메라 쉐이크 타겟) */
    #viewport {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
    }

    /* 배경 캔버스 (폭발 파티클 & 충격파) */
    #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* 시네마틱 비네팅 & 플래시 오버레이 */
    .vignette-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.85) 100%);
      z-index: 2;
      pointer-events: none;
    }

    .flash-overlay {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      z-index: 20;
      pointer-events: none;
    }

    /* 
      ========================================================================
      [씬(Scene) 공통 레이아웃]
      모든 씬은 절대 위치로 겹쳐져 있으며, 타임라인에 의해 전환됩니다.
      ========================================================================
    */
    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }

    /* ----------------------------------------------------------------------
       [SCENE 1: THE IMPACT - 슬램 인 & 충격파]
       거대한 글자가 카메라 앞으로 쾅 찍히며 화면이 흔들리는 임팩트
       ---------------------------------------------------------------------- */
    .scene-1 .giant-year {
      font-size: 19vw;
      font-weight: 900;
      line-height: 0.85;
      font-family: 'Cinzel', serif;
      background: linear-gradient(180deg, #ffffff 0%, #f2c94c 60%, #8a6513 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 45px rgba(242, 201, 76, 0.5));
      letter-spacing: -0.04em;
    }

    .scene-1 .impact-sub {
      font-size: 3.2vw;
      font-weight: 900;
      letter-spacing: 0.4em;
      color: #ffffff;
      text-transform: uppercase;
      margin-top: 2vh;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
    }

    .shockwave-ring {
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 6px solid #ffe699;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
    }

    /* ----------------------------------------------------------------------
       [SCENE 2: RHYTHMIC KINETIC - 고속 키네틱 타이포]
       애플/나이키 광고처럼 비트에 맞춰 단어가 고속으로 교체되는 씬
       ---------------------------------------------------------------------- */
    .scene-2 .word-container {
      position: relative;
      height: 25vw;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene-2 .kinetic-word {
      position: absolute;
      font-size: 15vw;
      font-weight: 900;
      font-family: 'Black Han Sans', 'Montserrat', sans-serif;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      white-space: nowrap;
      opacity: 0;
    }

    .scene-2 .word-1 {
      color: #ffffff;
      text-shadow: 0 0 35px rgba(255, 255, 255, 0.6);
    }
    .scene-2 .word-2 {
      color: var(--gold-primary);
      text-shadow: 0 0 45px rgba(242, 201, 76, 0.8);
    }
    .scene-2 .word-3 {
      color: #38bdf8;
      text-shadow: 0 0 45px rgba(56, 189, 248, 0.8);
    }
    .scene-2 .word-4 {
      background: linear-gradient(90deg, #ff334b, #f2c94c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .scene-2 .speed-lines {
      position: absolute;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ffe699, transparent);
      opacity: 0;
    }

    /* ----------------------------------------------------------------------
       [SCENE 3: 3D GOLDEN BLADE - 레이저 슬래시 & 3D 회전]
       대각선 레이저가 화면을 베고 지나가며 3D로 입체 텍스트가 회전 등장
       ---------------------------------------------------------------------- */
    .scene-3 {
      perspective: 1000px;
    }

    .laser-slash {
      position: absolute;
      top: 50%;
      left: -20%;
      width: 140%;
      height: 4px;
      background: linear-gradient(90deg, transparent, #ffffff, #f2c94c, transparent);
      box-shadow: 0 0 30px #ffffff, 0 0 60px #f2c94c;
      transform: rotate(-30deg) translateY(-50%);
      opacity: 0;
      z-index: 15;
    }

    .scene-3 .box-3d {
      transform-style: preserve-3d;
      text-align: center;
    }

    .scene-3 .badge-pill {
      display: inline-block;
      font-size: 1.3vw;
      font-weight: 700;
      letter-spacing: 0.3em;
      color: #ffe699;
      border: 1px solid rgba(212, 175, 55, 0.5);
      padding: 0.6vh 2vw;
      border-radius: 40px;
      margin-bottom: 2vh;
      background: rgba(212, 175, 55, 0.1);
      backdrop-filter: blur(10px);
    }

    .scene-3 .title-3d {
      font-size: 6.5vw;
      font-weight: 900;
      font-family: 'Cinzel', serif;
      background: linear-gradient(135deg, #ffffff 0%, #fef3c7 40%, #d4af37 70%, #aa771c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.04em;
      line-height: 1.1;
      filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.8));
    }

    .scene-3 .sub-3d {
      font-size: 2.2vw;
      font-weight: 700;
      color: #cbd5e1;
      margin-top: 1.8vh;
      letter-spacing: 0.15em;
    }

    /* ----------------------------------------------------------------------
       [SCENE 4: PRESTIGE WINNER REVEAL - 시상식 대상자 극적 발표]
       암전 속에서 조명이 열리며 수상자 이름이 거대하게 떠오르는 씬
       ---------------------------------------------------------------------- */
    .scene-4 .laurel-wreath {
      width: 8vw;
      height: 8vw;
      margin-bottom: 2vh;
      fill: url(#goldGradient4);
      filter: drop-shadow(0 0 25px rgba(242, 201, 76, 0.6));
    }

    .scene-4 .award-tag {
      font-size: 1.6vw;
      font-family: 'Cinzel', serif;
      font-weight: 800;
      letter-spacing: 0.35em;
      color: #f2c94c;
      text-transform: uppercase;
      margin-bottom: 1.5vh;
    }

    .scene-4 .winner-name {
      font-size: 8.5vw;
      font-weight: 900;
      font-family: 'Noto Sans KR', sans-serif;
      letter-spacing: -0.02em;
      line-height: 1;
      background: linear-gradient(180deg, #ffffff 0%, #fff6d6 50%, #d4af37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 60px rgba(242, 201, 76, 0.45);
    }

    .scene-4 .winner-dept {
      font-size: 2.4vw;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.1em;
      margin-top: 1.5vh;
    }

    /* ----------------------------------------------------------------------
       [하단 컨트롤 바]
       사용자가 재생/일시정지 및 씬별로 바로 이동해서 구경할 수 있는 바
       ---------------------------------------------------------------------- */
    .control-dock {
      position: absolute;
      bottom: 2.5vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 1.2vw;
      background: rgba(10, 16, 32, 0.75);
      border: 1px solid rgba(212, 175, 55, 0.35);
      backdrop-filter: blur(16px);
      padding: 0.8vh 1.6vw;
      border-radius: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .control-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 0.85vw;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      padding: 0.4vh 0.8vw;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.25s;
    }

    .control-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    .control-btn.active {
      color: #03050c;
      background: linear-gradient(135deg, #f2c94c, #ffd700);
      box-shadow: 0 0 12px rgba(242, 201, 76, 0.6);
    }

    .timeline-bar-wrap {
      width: 14vw;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .timeline-progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f2c94c, #ffffff);
      box-shadow: 0 0 8px #f2c94c;
    }

    .fs-toggle-btn {
      position: absolute;
      top: 2vh;
      right: 2vw;
      z-index: 100;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #ffe699;
      padding: 0.4vh 0.8vw;
      border-radius: 6px;
      font-size: 0.75vw;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 전체화면 토글 버튼 -->
  <button class="fs-toggle-btn" onclick="toggleFullScreen()">⛶ F11 전체화면</button>

  <!-- 뷰포트 (카메라 흔들림 타겟) -->
  <div id="viewport">
    
    <!-- 파티클 & 충격파 캔버스 -->
    <canvas id="fx-canvas"></canvas>

    <!-- 배경 비네팅 및 섬광 효과 -->
    <div class="vignette-overlay"></div>
    <div class="flash-overlay" id="flash"></div>
    <div class="shockwave-ring" id="shockwave"></div>
    <div class="laser-slash" id="laser"></div>

    <!-- SVG 그라데이션 정의 -->
    <svg style="position: absolute; width: 0; height: 0;">
      <defs>
        <linearGradient id="goldGradient4" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="40%" stop-color="#f2c94c" />
          <stop offset="100%" stop-color="#996515" />
        </linearGradient>
      </defs>
    </svg>

    <!-- ====================================================================
         [SCENE 1: THE IMPACT - 슬램 인 & 충격파]
         ==================================================================== -->
    <section class="scene scene-1" id="scene1">
      <div class="giant-year" id="s1-year">2026</div>
      <div class="impact-sub" id="s1-sub">A NEW CHAPTER OF EXCELLENCE</div>
    </section>

    <!-- ====================================================================
         [SCENE 2: RHYTHMIC KINETIC - 초고속 키네틱 컷]
         ==================================================================== -->
    <section class="scene scene-2" id="scene2">
      <div class="speed-lines" id="speed-line-1" style="top: 25%;"></div>
      <div class="speed-lines" id="speed-line-2" style="bottom: 25%;"></div>
      <div class="word-container">
        <div class="kinetic-word word-1" id="w1">PASSION</div>
        <div class="kinetic-word word-2" id="w2">DEVOTION</div>
        <div class="kinetic-word word-3" id="w3">INNOVATION</div>
        <div class="kinetic-word word-4" id="w4">우리의 모든 순간</div>
      </div>
    </section>

    <!-- ====================================================================
         [SCENE 3: 3D GOLDEN BLADE - 레이저 슬래시 & 3D 회전 등장]
         ==================================================================== -->
    <section class="scene scene-3" id="scene3">
      <div class="box-3d" id="s3-box">
        <span class="badge-pill">SPECIAL RECOGNITION</span>
        <h2 class="title-3d">HONOR & GLORY</h2>
        <p class="sub-3d">가장 눈부신 헌신으로 병원을 빛낸 주역</p>
      </div>
    </section>

    <!-- ====================================================================
         [SCENE 4: PRESTIGE WINNER - 영예의 대상 극적 발표]
         ==================================================================== -->
    <section class="scene scene-4" id="scene4">
      <svg class="laurel-wreath" id="s4-laurel" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/>
      </svg>
      <div class="award-tag" id="s4-tag">GRAND AWARD OF THE YEAR</div>
      <h1 class="winner-name" id="s4-name">김 진 우 과장</h1>
      <div class="winner-dept" id="s4-dept">심혈관센터 · 진료부장</div>
    </section>

  </div>

  <!-- ====================================================================
       [하단 컨트롤 독: 재생/일시정지 및 씬별 점프]
       ==================================================================== -->
  <div class="control-dock">
    <button class="control-btn" id="play-pause-btn" onclick="togglePlayPause()">❚❚ 일시정지</button>
    <div class="timeline-bar-wrap">
      <div class="timeline-progress" id="progress-bar"></div>
    </div>
    <button class="control-btn" onclick="jumpToScene(1)">01 슬램 인트로</button>
    <button class="control-btn" onclick="jumpToScene(2)">02 키네틱 비트</button>
    <button class="control-btn" onclick="jumpToScene(3)">03 3D 슬래시</button>
    <button class="control-btn" onclick="jumpToScene(4)">04 대상자 발표</button>
    <button class="control-btn" onclick="restartTimeline()">↺ 처음부터</button>
  </div>

  <script>
    /* =====================================================================
       [1. 파티클 & 충격파 캔버스 엔진]
       ===================================================================== */
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor(x, y, color, speedScale = 1) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = (Math.random() * 8 + 2) * speedScale;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.size = Math.random() * 3.5 + 1.2;
        this.alpha = 1;
        this.decay = Math.random() * 0.025 + 0.015;
        this.color = color || '#f2c94c';
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.96;
        this.vy *= 0.96;
        this.alpha -= this.decay;
        return this.alpha > 0;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // 파티클 폭발 함수
    function explodeParticles(x, y, count = 70, color = '#ffd700', speedScale = 1) {
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color, speedScale));
      }
    }

    function renderFX() {
      ctx.clearRect(0, 0, width, height);
      particles = particles.filter(p => {
        const alive = p.update();
        if (alive) p.draw();
        return alive;
      });
      requestAnimationFrame(renderFX);
    }
    renderFX();

    // 카메라 쉐이크 함수 (화면 흔들림)
    function cameraShake(intensity = 15) {
      const vp = document.getElementById('viewport');
      gsap.fromTo(vp, 
        { x: (Math.random() - 0.5) * intensity, y: (Math.random() - 0.5) * intensity },
        { x: 0, y: 0, duration: 0.35, ease: "elastic.out(1, 0.3)" }
      );
    }

    // 섬광 플래시 함수
    function screenFlash(opacity = 0.8) {
      gsap.fromTo('#flash', { opacity: opacity }, { opacity: 0, duration: 0.45, ease: "power2.out" });
    }

    /* =====================================================================
       [2. GSAP 메인 키네틱 모션그래픽 타임라인]
       영상과 똑같이 시간(Time)의 축을 따라 진행되는 시퀀스
       ===================================================================== */
    const masterTL = gsap.timeline({
      repeat: -1,
      onUpdate: updateProgressBar
    });

    function setupKineticTimeline() {
      masterTL.clear();

      // -------------------------------------------------------------------
      // [SCENE 1: THE IMPACT (0.0s ~ 4.5s)]
      // 거대한 2026이 화면 앞으로 쾅 찍히며 충격파 발생
      // -------------------------------------------------------------------
      masterTL
        .addLabel("scene1", 0)
        .set("#scene1", { visibility: "visible", opacity: 1 }, "scene1")
        .fromTo("#s1-year", 
          { scale: 5, opacity: 0, z: 600, filter: "blur(20px)" },
          { 
            scale: 1, 
            opacity: 1, 
            z: 0, 
            filter: "blur(0px)",
            duration: 0.85, 
            ease: "power4.in",
            onComplete: () => {
              cameraShake(25);
              screenFlash(0.9);
              explodeParticles(window.innerWidth / 2, window.innerHeight / 2, 90, '#ffe699', 1.8);
            }
          }, 
          "scene1+=0.2"
        )
        // 충격파 링 확산
        .fromTo("#shockwave", 
          { width: 50, height: 50, opacity: 1, x: "-50%", y: "-50%", top: "50%", left: "50%" },
          { width: window.innerWidth * 1.5, height: window.innerWidth * 1.5, opacity: 0, duration: 0.9, ease: "power2.out" },
          "scene1+=1.05"
        )
        .fromTo("#s1-sub", 
          { y: 50, opacity: 0, letterSpacing: "1.2em" },
          { y: 0, opacity: 1, letterSpacing: "0.4em", duration: 1.0, ease: "power3.out" },
          "scene1+=1.1"
        )
        // 씬 1 퇴장 (화면 앞으로 급가속 줌아웃)
        .to("#scene1", { scale: 1.3, opacity: 0, filter: "blur(15px)", duration: 0.5, ease: "power2.in" }, "scene1+=3.8")
        .set("#scene1", { visibility: "hidden" })

      // -------------------------------------------------------------------
      // [SCENE 2: RHYTHMIC KINETIC (4.5s ~ 9.5s)]
      // 음악 박자에 맞춰 글자가 고속으로 전환되는 비트 키네틱
      // -------------------------------------------------------------------
      masterTL
        .addLabel("scene2", 4.5)
        .set("#scene2", { visibility: "visible", opacity: 1 }, "scene2")
        
        // PASSION
        .fromTo("#w1", 
          { scale: 0.4, opacity: 0, x: -100 },
          { scale: 1, opacity: 1, x: 0, duration: 0.35, ease: "back.out(2)", onStart: () => cameraShake(10) },
          "scene2+=0.1"
        )
        .to("#w1", { opacity: 0, scale: 1.5, filter: "blur(10px)", duration: 0.25 }, "scene2+=1.0")

        // DEVOTION
        .fromTo("#w2", 
          { scale: 2, opacity: 0, y: -80 },
          { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power4.out", onStart: () => cameraShake(12) },
          "scene2+=1.2"
        )
        .to("#w2", { opacity: 0, scale: 0.6, duration: 0.25 }, "scene2+=2.1")

        // INNOVATION
        .fromTo("#w3", 
          { scale: 0.6, opacity: 0, letterSpacing: "0.5em" },
          { scale: 1, opacity: 1, letterSpacing: "0.02em", duration: 0.4, ease: "expo.out", onStart: () => screenFlash(0.5) },
          "scene2+=2.3"
        )
        .to("#w3", { opacity: 0, y: 100, duration: 0.25 }, "scene2+=3.2")

        // 우리의 모든 순간
        .fromTo("#w4", 
          { scale: 0.8, opacity: 0, filter: "blur(8px)" },
          { 
            scale: 1, 
            opacity: 1, 
            filter: "blur(0px)",
            duration: 0.5, 
            ease: "power3.out",
            onStart: () => {
              cameraShake(18);
              explodeParticles(window.innerWidth / 2, window.innerHeight / 2, 60, '#ff334b', 1.2);
            }
          },
          "scene2+=3.4"
        )
        .to("#scene2", { opacity: 0, duration: 0.4 }, "scene2+=4.6")
        .set("#scene2", { visibility: "hidden" })

      // -------------------------------------------------------------------
      // [SCENE 3: 3D GOLDEN BLADE (9.5s ~ 15.0s)]
      // 레이저 슬래시가 화면을 베고 3D 회전 등장
      // -------------------------------------------------------------------
      masterTL
        .addLabel("scene3", 9.5)
        .set("#scene3", { visibility: "visible", opacity: 1 }, "scene3")
        
        // 레이저 광선 슬래시
        .fromTo("#laser", 
          { left: "-100%", opacity: 1 },
          { 
            left: "140%", 
            opacity: 1, 
            duration: 0.4, 
            ease: "power2.inOut",
            onStart: () => {
              screenFlash(0.7);
              cameraShake(15);
            }
          }, 
          "scene3+=0.1"
        )
        .to("#laser", { opacity: 0, duration: 0.2 }, "scene3+=0.5")

        // 3D 텍스트 박스 회전 등장
        .fromTo("#s3-box", 
          { rotateX: -60, rotateY: 25, z: -400, opacity: 0 },
          { 
            rotateX: 0, 
            rotateY: 0, 
            z: 0, 
            opacity: 1, 
            duration: 1.3, 
            ease: "power3.out",
            onStart: () => explodeParticles(window.innerWidth / 2, window.innerHeight / 2, 70, '#f2c94c', 1.4)
          }, 
          "scene3+=0.4"
        )
        .to("#s3-box", { rotateY: -15, duration: 3.2, ease: "sine.inOut" }, "scene3+=1.7")
        .to("#scene3", { opacity: 0, scale: 0.85, filter: "blur(12px)", duration: 0.6 }, "scene3+=4.9")
        .set("#scene3", { visibility: "hidden" })

      // -------------------------------------------------------------------
      // [SCENE 4: PRESTIGE WINNER REVEAL (15.0s ~ 21.0s)]
      // 시상식 대상 수상자 극적 공개
      // -------------------------------------------------------------------
      masterTL
        .addLabel("scene4", 15.0)
        .set("#scene4", { visibility: "visible", opacity: 1 }, "scene4")
        
        // 월계수 엠블럼 회전 등장
        .fromTo("#s4-laurel", 
          { scale: 0, rotate: -180, opacity: 0 },
          { scale: 1, rotate: 0, opacity: 1, duration: 0.9, ease: "back.out(1.8)" },
          "scene4+=0.1"
        )
        .fromTo("#s4-tag", 
          { opacity: 0, y: -20 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
          "scene4+=0.6"
        )
        // 수상자 이름 쾅!
        .fromTo("#s4-name", 
          { scale: 1.8, opacity: 0, filter: "blur(15px)" },
          { 
            scale: 1, 
            opacity: 1, 
            filter: "blur(0px)",
            duration: 0.8, 
            ease: "power4.out",
            onStart: () => {
              cameraShake(22);
              screenFlash(0.85);
              explodeParticles(window.innerWidth / 2, window.innerHeight * 0.55, 110, '#ffd700', 2.0);
            }
          },
          "scene4+=1.1"
        )
        .fromTo("#s4-dept", 
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
          "scene4+=1.6"
        )
        // 씬 4 퇴장 (부드러운 페이드아웃 후 루프)
        .to("#scene4", { opacity: 0, filter: "blur(10px)", duration: 0.8 }, "scene4+=5.2")
        .set("#scene4", { visibility: "hidden" });
    }

    /* =====================================================================
       [3. 컨트롤러 및 진행률 바]
       ===================================================================== */
    function updateProgressBar() {
      const progress = masterTL.progress() * 100;
      document.getElementById('progress-bar').style.width = `${progress}%`;
    }

    function togglePlayPause() {
      const btn = document.getElementById('play-pause-btn');
      if (masterTL.paused()) {
        masterTL.play();
        btn.innerText = "❚❚ 일시정지";
      } else {
        masterTL.pause();
        btn.innerText = "▶ 재생";
      }
    }

    function jumpToScene(num) {
      masterTL.play();
      document.getElementById('play-pause-btn').innerText = "❚❚ 일시정지";
      masterTL.seek(`scene${num}`);
    }

    function restartTimeline() {
      masterTL.restart();
      document.getElementById('play-pause-btn').innerText = "❚❚ 일시정지";
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // 초기 실행
    window.addEventListener('DOMContentLoaded', () => {
      setupKineticTimeline();
    });
  </script>
</body>
</html>
