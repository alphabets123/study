<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>탭소닉 스타일 키네틱 모션그래픽 데모 2 (Rhythm Game Result VFX)</title>
  
  <!-- Google Fonts: 리듬게임 특유의 날렵하고 묵직한 이탤릭 볼드 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Chakra+Petch:ital,wght@1,700;1,800;1,900&family=Montserrat:ital,wght@1,900&family=Noto+Sans+KR:wght@900&display=swap" rel="stylesheet">
  
  <!-- GSAP Animation Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    :root {
      --bg-dark: #070913;
      --gold-neon: #ffd700;
      --gold-bright: #fff2a3;
      --cyan-neon: #00f0ff;
      --pink-neon: #ff0055;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: 'Chakra Petch', 'Montserrat', 'Noto Sans KR', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #game-stage {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 캔버스 (리듬게임 스타일 폴리곤 샤드/스파크 파티클) */
    #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* 배경 사선 격자 스트라이프 (DJMAX/탭소닉 특유의 스피드 그리드) */
    .rhythm-bg-grid {
      position: absolute;
      inset: -50%;
      width: 200%;
      height: 200%;
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(255, 255, 255, 0.012) 0px,
        rgba(255, 255, 255, 0.012) 20px,
        transparent 20px,
        transparent 40px
      );
      z-index: 0;
      pointer-events: none;
      animation: gridScroll 18s linear infinite;
    }

    @keyframes gridScroll {
      0% { transform: translateY(0); }
      100% { transform: translateY(100px); }
    }

    /* 
      ========================================================================
      [핵심 기술: 사선 반전 닦아내기 와이프 (Dual Layer Invert Wipe)]
      동일한 글자가 어두운 배경(Layer 1)과 밝은 골드 블레이드(Layer 2)로 
      동시에 렌더링되고, 사선 와이프가 지나가며 글자 색이 완벽하게 반전 분할됨!
      ========================================================================
    */
    .wipe-scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      opacity: 0;
      visibility: hidden;
    }

    /* 1. 어두운 기본 레이어 (Dark Base) */
    .layer-dark {
      position: absolute;
      inset: 0;
      background: #060914;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    /* 2. 밝은 황금 와이프 레이어 (Bright Gold Blade - 클립패스로 사선 닦아내기) */
    .layer-bright {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #fff3b0 0%, #ffd700 40%, #ffaa00 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 3;
      /* 초기에는 화면 우측 밖으로 완전히 숨겨진 사선 클립패스 */
      clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%);
    }

    /* 와이프 칼날 레이저 테두리 선 */
    .wipe-laser-edge {
      position: absolute;
      top: -20vh;
      bottom: -20vh;
      width: 12px;
      background: #ffffff;
      box-shadow: 0 0 25px #ffffff, 0 0 50px #00f0ff, 0 0 80px #ffd700;
      transform: rotate(25deg);
      z-index: 5;
      opacity: 0;
      pointer-events: none;
    }

    /* 
      전체화면을 압도하는 거대 텍스트 (탭소닉 탑 스타일 기울어진 볼드 폰트) 
    */
    .giant-title {
      font-size: 14vw;
      font-weight: 900;
      font-style: italic;
      line-height: 0.88;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
      transform: skewX(-8deg);
    }

    /* 다크 레이어의 글자: 네온 골드 & 시안 발광 */
    .layer-dark .giant-title {
      color: #ffffff;
      text-shadow: 0 0 40px rgba(255, 215, 0, 0.7), 0 0 80px rgba(0, 240, 255, 0.4);
    }

    /* 브라이트 레이어의 글자: 반전된 칠흑 블랙 & 핫핑크 그림자 */
    .layer-bright .giant-title {
      color: #05070d;
      text-shadow: 4px 4px 0px rgba(255, 0, 85, 0.4);
    }

    .sub-banner {
      font-size: 2.2vw;
      font-weight: 800;
      font-style: italic;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      margin-top: 3vh;
      transform: skewX(-8deg);
    }

    .layer-dark .sub-banner {
      color: #00f0ff;
      text-shadow: 0 0 20px #00f0ff;
    }
    .layer-bright .sub-banner {
      color: #1a1a2e;
    }

    /* ----------------------------------------------------------------------
       [씬 2: RANK SSS 랭크 스탬프 & 카운트업]
       리듬게임 결과창 특유의 SSS 도장 쾅! + 점수 롤링
       ---------------------------------------------------------------------- */
    .scene-rank {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      opacity: 0;
      visibility: hidden;
    }

    .rank-letter-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rank-sss {
      font-size: 22vw;
      font-weight: 900;
      font-style: italic;
      line-height: 0.8;
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(180deg, #ffffff 0%, #ffd700 50%, #ff5500 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transform: skewX(-12deg);
      filter: drop-shadow(0 0 50px rgba(255, 215, 0, 0.8));
    }

    /* 크로매틱 어베레이션 (글리치 RGB 분리 효과) */
    .rank-chromatic {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22vw;
      font-weight: 900;
      font-style: italic;
      line-height: 0.8;
      font-family: 'Montserrat', sans-serif;
      transform: skewX(-12deg);
      pointer-events: none;
      opacity: 0;
    }
    .chroma-red {
      color: #ff0055;
      transform: skewX(-12deg) translate(-6px, 0);
      mix-blend-mode: screen;
    }
    .chroma-cyan {
      color: #00f0ff;
      transform: skewX(-12deg) translate(6px, 0);
      mix-blend-mode: screen;
    }

    .score-board {
      display: flex;
      align-items: baseline;
      gap: 1.5vw;
      margin-top: 1vh;
      transform: skewX(-8deg);
    }

    .score-label {
      font-size: 1.8vw;
      font-weight: 800;
      color: #94a3b8;
      letter-spacing: 0.2em;
    }

    .score-number {
      font-size: 5vw;
      font-weight: 900;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.8);
    }

    .award-winner-box {
      margin-top: 2vh;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid var(--gold-neon);
      padding: 1vh 3vw;
      border-radius: 4px;
      transform: skewX(-10deg);
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
    }

    .winner-highlight {
      font-size: 2.8vw;
      font-weight: 900;
      color: #fff2a3;
      letter-spacing: 0.1em;
      transform: skewX(10deg); /* 텍스트 자체는 정자세로 복구 */
      display: inline-block;
    }

    /* ----------------------------------------------------------------------
       [하단 컨트롤 바]
       ---------------------------------------------------------------------- */
    .control-dock {
      position: absolute;
      bottom: 2.5vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 1.2vw;
      background: rgba(8, 12, 24, 0.85);
      border: 1.5px solid rgba(255, 215, 0, 0.4);
      backdrop-filter: blur(16px);
      padding: 0.8vh 1.6vw;
      border-radius: 40px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.7);
    }

    .control-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 0.82vw;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 800;
      padding: 0.5vh 0.9vw;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.25s;
    }
    .control-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
    }
    .control-btn.active {
      color: #070913;
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    }

    .progress-track {
      width: 14vw;
      height: 5px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00f0ff, #ffd700);
      box-shadow: 0 0 10px #ffd700;
    }

    .fs-btn {
      position: absolute;
      top: 2vh;
      right: 2vw;
      z-index: 100;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--gold-neon);
      color: #ffd700;
      padding: 0.5vh 0.9vw;
      border-radius: 6px;
      font-size: 0.75vw;
      cursor: pointer;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <button class="fs-btn" onclick="toggleFullScreen()">⛶ F11 전체화면</button>

  <div id="game-stage">
    
    <!-- 배경 리듬 그리드 & 파티클 캔버스 -->
    <div class="rhythm-bg-grid"></div>
    <canvas id="fx-canvas"></canvas>

    <!-- 사선 레이저 칼날 테두리선 -->
    <div class="wipe-laser-edge" id="laser-edge"></div>

    <!-- ====================================================================
         [SCENE 1: 탭소닉 특유의 사선 반전 닦아내기 와이프]
         Dark 레이어 위에 Bright 레이어가 사선으로 덮치며 글자 색이 완벽 반전!
         ==================================================================== -->
    <div class="wipe-scene" id="scene-wipe">
      
      <!-- 1층: 다크 베이스 (화이트/골드 텍스트) -->
      <div class="layer-dark">
        <div class="giant-title" id="dark-title">STAGE CLEAR</div>
        <div class="sub-banner">2026 ANNUAL MEDICAL AWARDS</div>
      </div>

      <!-- 2층: 브라이트 골드 와이프 블레이드 (블랙 텍스트 반전) -->
      <div class="layer-bright" id="bright-blade">
        <div class="giant-title" id="bright-title">STAGE CLEAR</div>
        <div class="sub-banner">2026 ANNUAL MEDICAL AWARDS</div>
      </div>

    </div>

    <!-- ====================================================================
         [SCENE 2: 탭소닉 랭크 SSS 스탬프 & 영예의 대상 발표]
         ==================================================================== -->
    <div class="scene-rank" id="scene-rank">
      <div class="rank-letter-wrap">
        <div class="rank-sss" id="rank-text">SSS</div>
        <!-- 글리치 크로매틱 분리 레이어 -->
        <div class="rank-chromatic chroma-red" id="chroma-r">SSS</div>
        <div class="rank-chromatic chroma-cyan" id="chroma-c">SSS</div>
      </div>

      <div class="score-board">
        <span class="score-label">ACHIEVEMENT RATE</span>
        <span class="score-number" id="score-counter">00.00%</span>
      </div>

      <div class="award-winner-box" id="winner-box">
        <span class="winner-highlight">🏆 올해의 대상 : 김 진 우 과장 (심혈관센터)</span>
      </div>
    </div>

  </div>

  <!-- 하단 컨트롤 바 -->
  <div class="control-dock">
    <button class="control-btn" id="play-btn" onclick="togglePlayPause()">❚❚ 일시정지</button>
    <div class="progress-track">
      <div class="progress-fill" id="p-bar"></div>
    </div>
    <button class="control-btn" onclick="jumpTo(1)">01 사선 반전 닦아내기</button>
    <button class="control-btn" onclick="jumpTo(2)">02 랭크 SSS & 점수</button>
    <button class="control-btn" onclick="restart()">↺ 처음부터</button>
  </div>

  <script>
    /* =====================================================================
       [1. 리듬게임 스타일 다이아몬드/샤드 파티클 캔버스 엔진]
       ===================================================================== */
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let shards = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class RhythmShard {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 12 + 4;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.size = Math.random() * 14 + 4;
        this.angle = Math.random() * Math.PI;
        this.rotSpeed = (Math.random() - 0.5) * 0.2;
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.015;
        this.color = color || '#ffd700';
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.95;
        this.vy *= 0.95;
        this.angle += this.rotSpeed;
        this.alpha -= this.decay;
        return this.alpha > 0;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = this.color;
        // 다이아몬드 사각 폴리곤 샤드 그리기
        ctx.beginPath();
        ctx.moveTo(0, -this.size);
        ctx.lineTo(this.size * 0.6, 0);
        ctx.lineTo(0, this.size);
        ctx.lineTo(-this.size * 0.6, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    function burstShards(x, y, count = 60, color = '#ffd700') {
      for (let i = 0; i < count; i++) {
        shards.push(new RhythmShard(x, y, color));
      }
    }

    function renderLoop() {
      ctx.clearRect(0, 0, width, height);
      shards = shards.filter(s => {
        const alive = s.update();
        if (alive) s.draw();
        return alive;
      });
      requestAnimationFrame(renderLoop);
    }
    renderLoop();

    // 화면 진동 함수
    function stageShake(power = 18) {
      gsap.fromTo('#game-stage', 
        { x: (Math.random() - 0.5) * power, y: (Math.random() - 0.5) * power },
        { x: 0, y: 0, duration: 0.3, ease: "elastic.out(1, 0.3)" }
      );
    }

    /* =====================================================================
       [2. GSAP 타임라인: 탭소닉 탑 사선 와이프 & 랭크 시퀀스]
       ===================================================================== */
    const master = gsap.timeline({
      repeat: -1,
      onUpdate: () => {
        const p = master.progress() * 100;
        document.getElementById('p-bar').style.width = `${p}%`;
      }
    });

    function setupTapsonicTimeline() {
      master.clear();

      // [PHASE 1: STAGE CLEAR 사선 반전 닦아내기 와이프]
      master
        .addLabel("scene1", 0)
        .set("#scene-wipe", { visibility: "visible", opacity: 1 }, "scene1")
        .set("#bright-blade", { 
          clipPath: "polygon(120% 0, 120% 0, 120% 100%, 120% 100%)" 
        }, "scene1")
        
        // 다크 타이틀 급가속 줌인
        .fromTo("#dark-title", 
          { scale: 3.5, opacity: 0, filter: "blur(20px)" },
          { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power4.out" },
          "scene1+=0.2"
        )

        // 🌟 핵심: 탭소닉 특유의 사선 와이프가 화면 우측에서 좌측으로 쓱- 베고 지나가며 반전!
        .fromTo("#bright-blade", 
          { clipPath: "polygon(140% -20%, 140% -20%, 140% 120%, 140% 120%)" },
          { 
            clipPath: "polygon(-40% -20%, 140% -20%, 140% 120%, -40% 120%)", 
            duration: 0.9, 
            ease: "expo.inOut",
            onStart: () => {
              stageShake(20);
              burstShards(window.innerWidth * 0.7, window.innerHeight * 0.5, 70, '#00f0ff');
            }
          },
          "scene1+=1.1"
        )
        // 레이저 칼날 경계선 싱크
        .fromTo("#laser-edge", 
          { left: "120%", opacity: 1 },
          { left: "-30%", opacity: 1, duration: 0.9, ease: "expo.inOut" },
          "scene1+=1.1"
        )
        .set("#laser-edge", { opacity: 0 }, "scene1+=2.0")

        // 잠시 감상 시간 후 씬 1 퇴장 (사선으로 쪼개지며 사라짐)
        .to("#scene-wipe", { 
          scale: 1.15, 
          opacity: 0, 
          filter: "blur(15px)", 
          duration: 0.5, 
          ease: "power2.in" 
        }, "scene1+=4.2")
        .set("#scene-wipe", { visibility: "hidden" })

      // [PHASE 2: 랭크 SSS 스탬프 & 점수 카운트업]
      master
        .addLabel("scene2", 4.8)
        .set("#scene-rank", { visibility: "visible", opacity: 1 }, "scene2")
        
        // SSS 랭크 스탬프 쾅!
        .fromTo("#rank-text", 
          { scale: 6, opacity: 0, rotate: -25 },
          { 
            scale: 1, 
            opacity: 1, 
            rotate: 0, 
            duration: 0.55, 
            ease: "power4.in",
            onComplete: () => {
              stageShake(30);
              burstShards(window.innerWidth / 2, window.innerHeight * 0.35, 100, '#ffd700');
            }
          },
          "scene2+=0.2"
        )

        // 크로매틱 글리치 번쩍임
        .fromTo("#chroma-r", { opacity: 0.9, x: -20 }, { opacity: 0, x: 0, duration: 0.4 }, "scene2+=0.75")
        .fromTo("#chroma-c", { opacity: 0.9, x: 20 }, { opacity: 0, x: 0, duration: 0.4 }, "scene2+=0.75")

        // 점수 카운트업 (0% -> 99.98%)
        .fromTo("#score-counter", 
          { innerText: 0 },
          {
            innerText: 99.98,
            duration: 1.5,
            ease: "power2.out",
            snap: { innerText: 0.01 },
            onUpdate: function() {
              document.getElementById('score-counter').innerText = 
                Number(document.getElementById('score-counter').innerText).toFixed(2) + "%";
            }
          },
          "scene2+=0.8"
        )

        // 수상자 박스 슬라이드 인
        .fromTo("#winner-box", 
          { y: 80, opacity: 0, scale: 0.9 },
          { y: 0, opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.5)" },
          "scene2+=1.3"
        )

        // 씬 2 퇴장 (루프)
        .to("#scene-rank", { opacity: 0, duration: 0.7 }, "scene2+=5.2")
        .set("#scene-rank", { visibility: "hidden" });
    }

    /* =====================================================================
       [3. 컨트롤러]
       ===================================================================== */
    function togglePlayPause() {
      const btn = document.getElementById('play-btn');
      if (master.paused()) {
        master.play();
        btn.innerText = "❚❚ 일시정지";
      } else {
        master.pause();
        btn.innerText = "▶ 재생";
      }
    }

    function jumpTo(sceneNum) {
      master.play();
      document.getElementById('play-btn').innerText = "❚❚ 일시정지";
      master.seek(`scene${sceneNum}`);
    }

    function restart() {
      master.restart();
      document.getElementById('play-btn').innerText = "❚❚ 일시정지";
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      setupTapsonicTimeline();
    });
  </script>
</body>
</html>
