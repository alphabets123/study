<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAPSONIC TOP - Result Screen (Beat U Down)</title>
  
  <!-- Google Fonts: 아케이드 리듬게임 전용 볼드/컨덴스드 이탤릭 타이포그래피 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@1,700;1,800;1,900&family=Montserrat:ital,wght@1,800;1,900&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- GSAP Animation Core -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    :root {
      --ts-yellow: #ffdb00;
      --ts-yellow-bright: #fff240;
      --ts-black: #11131a;
      --ts-card-black: #181b24;
      --ts-cyan: #00e5ff;
      --ts-pink: #ff135d;
      --ts-white: #ffffff;
      --skew-deg: -12deg;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: var(--ts-black);
      color: #ffffff;
      font-family: 'Chakra Petch', 'Montserrat', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 
      ========================================================================
      [1. 탭소닉 탑 시그니처 옐로우 배경 스테이지]
      진짜 게임처럼 묵직하고 강렬한 형광 노랑(#FFDB00) + 카본 블랙 지오메트릭 기하학
      ========================================================================
    */
    #screen-viewport {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: var(--ts-yellow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 배경 사선 카본 스트라이프 & 하프톤 도트 */
    .bg-stripes {
      position: absolute;
      inset: -50%;
      width: 200%;
      height: 200%;
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(0, 0, 0, 0.04) 0px,
        rgba(0, 0, 0, 0.04) 25px,
        transparent 25px,
        transparent 50px
      );
      pointer-events: none;
      z-index: 1;
    }

    /* 거대한 사선 블랙 백드롭 패널 (탭소닉 특유의 날렵한 컷팅) */
    .bg-black-cut {
      position: absolute;
      top: -20%;
      right: -15%;
      width: 65vw;
      height: 140%;
      background: var(--ts-black);
      transform: skewX(var(--skew-deg));
      box-shadow: -15px 0 50px rgba(0, 0, 0, 0.35);
      z-index: 2;
    }

    .bg-black-cut::before {
      content: '';
      position: absolute;
      top: 0;
      left: -15px;
      width: 8px;
      height: 100%;
      background: var(--ts-cyan);
    }

    /* 캔버스 (게임 클리어 다이아몬드 스파크) */
    #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 15;
      pointer-events: none;
    }

    /* ========================================================================
       [2. 상단 헤더: STAGE RESULT & 곡 정보]
       ======================================================================== */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2.2vh 3.5vw 1vh 3.5vw;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1.5vw;
    }

    .result-badge {
      background: var(--ts-black);
      color: var(--ts-yellow);
      font-size: 1.8vw;
      font-weight: 900;
      font-style: italic;
      padding: 0.6vh 1.8vw;
      transform: skewX(var(--skew-deg));
      letter-spacing: 0.08em;
      box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.2);
    }
    .result-badge span {
      display: inline-block;
      transform: skewX(calc(var(--skew-deg) * -1));
    }

    .song-title-group {
      transform: skewX(var(--skew-deg));
    }
    .song-title-group h1 {
      font-size: 2.6vw;
      font-weight: 900;
      font-style: italic;
      color: var(--ts-black);
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .song-title-group p {
      font-size: 0.95vw;
      font-weight: 800;
      color: rgba(17, 19, 26, 0.7);
      letter-spacing: 0.15em;
      margin-top: 0.3vh;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1vw;
      transform: skewX(var(--skew-deg));
    }

    .diff-pill {
      background: var(--ts-cyan);
      color: var(--ts-black);
      font-size: 1.0vw;
      font-weight: 900;
      padding: 0.4vh 1.2vw;
      border-radius: 2px;
      letter-spacing: 0.05em;
    }
    .level-pill {
      background: #ffffff;
      color: var(--ts-black);
      font-size: 1.0vw;
      font-weight: 900;
      padding: 0.4vh 1.2vw;
    }

    /* ========================================================================
       [3. 메인 콘텐츠: 좌측 앨범 재킷 & 우측 스코어/판정 결과판]
       ======================================================================== */
    main {
      position: relative;
      z-index: 10;
      flex: 1;
      display: grid;
      grid-template-columns: 38% 58%;
      gap: 4%;
      padding: 1vh 3.5vw 2vh 3.5vw;
      align-items: center;
    }

    /* [좌측: 앨범 재킷 & PERFECT PLAY 스탬프] */
    .jacket-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      perspective: 1000px;
    }

    .jacket-card {
      width: 24vw;
      height: 24vw;
      background: var(--ts-card-black);
      border: 6px solid var(--ts-black);
      box-shadow: 15px 15px 0px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: skewX(var(--skew-deg)) rotateY(-6deg);
    }

    /* 비트유다운 곡 아트워크 대용 리듬 아트 그래픽 */
    .jacket-art {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #1f2333 0%, #0d0f17 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .art-circle {
      width: 14vw;
      height: 14vw;
      border: 8px solid var(--ts-pink);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: pulseRecord 4s ease-in-out infinite alternate;
    }
    .art-core {
      width: 6vw;
      height: 6vw;
      background: var(--ts-yellow);
      border-radius: 50%;
      border: 6px solid var(--ts-black);
    }
    .art-title {
      position: absolute;
      bottom: 2vh;
      font-size: 2.2vw;
      font-weight: 900;
      font-style: italic;
      color: #ffffff;
      letter-spacing: 0.05em;
      text-shadow: 0 0 15px var(--ts-cyan);
    }

    @keyframes pulseRecord {
      0% { transform: scale(0.95) rotate(0deg); }
      100% { transform: scale(1.05) rotate(30deg); }
    }

    /* PERFECT PLAY 대각선 도장 스탬프 */
    .stamp-perfect-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-18deg) scale(0);
      background: var(--ts-pink);
      color: #ffffff;
      border: 4px solid #ffffff;
      padding: 0.8vh 2.4vw;
      font-size: 2.4vw;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.1em;
      white-space: nowrap;
      box-shadow: 0 10px 30px rgba(255, 19, 93, 0.7);
      z-index: 20;
    }

    /* [우측: 스코어 및 랭크 보드] */
    .result-data-panel {
      display: flex;
      flex-direction: column;
      gap: 1.8vh;
    }

    /* 랭크 S+ 및 총점 영역 */
    .rank-and-score-row {
      display: flex;
      align-items: center;
      gap: 2vw;
    }

    /* 탭소닉 특유의 묵직한 오각형/기하학 랭크 엠블럼 */
    .rank-emblem-box {
      width: 9vw;
      height: 9vw;
      min-width: 100px;
      min-height: 100px;
      background: var(--ts-black);
      border: 4px solid var(--ts-yellow);
      transform: skewX(var(--skew-deg));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .rank-text {
      font-size: 6.2vw;
      font-weight: 900;
      font-style: italic;
      color: var(--ts-yellow);
      line-height: 0.85;
      text-shadow: 0 0 25px rgba(255, 219, 0, 0.8);
      transform: skewX(calc(var(--skew-deg) * -1));
    }

    .score-block {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .score-title-tag {
      font-size: 1.1vw;
      font-weight: 800;
      color: var(--ts-cyan);
      letter-spacing: 0.25em;
      margin-bottom: 0.2vh;
    }

    .digital-score {
      font-family: 'Teko', sans-serif;
      font-size: 6.5vw;
      font-weight: 700;
      line-height: 0.85;
      color: #ffffff;
      letter-spacing: 0.05em;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }

    /* 세부 판정 게이지 바 (PERFECT+, PERFECT, GOOD, MISS) */
    .judgment-breakdown {
      display: flex;
      flex-direction: column;
      gap: 0.8vh;
      background: rgba(0, 0, 0, 0.4);
      padding: 1.6vh 1.8vw;
      border-radius: 4px;
      transform: skewX(var(--skew-deg));
    }

    .judge-row {
      display: grid;
      grid-template-columns: 28% 48% 24%;
      align-items: center;
      font-size: 1.1vw;
      font-weight: 900;
      font-style: italic;
    }

    .judge-name {
      letter-spacing: 0.05em;
    }
    .judge-name.p-plus { color: var(--ts-cyan); text-shadow: 0 0 8px var(--ts-cyan); }
    .judge-name.p { color: var(--ts-yellow); }
    .judge-name.g { color: #4ade80; }
    .judge-name.m { color: #64748b; }

    .judge-bar-track {
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-right: 1.2vw;
    }
    .judge-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 2px;
    }
    .fill-p-plus { background: var(--ts-cyan); box-shadow: 0 0 8px var(--ts-cyan); }
    .fill-p { background: var(--ts-yellow); }
    .fill-g { background: #4ade80; }
    .fill-m { background: #64748b; }

    .judge-count {
      text-align: right;
      font-family: 'Teko', sans-serif;
      font-size: 1.8vw;
      color: #ffffff;
      line-height: 1;
    }

    .combo-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.6vh;
      border-top: 1px dashed rgba(255, 255, 255, 0.15);
      font-size: 1.1vw;
      font-weight: 900;
      color: var(--ts-pink);
    }
    .combo-count {
      font-family: 'Teko', sans-serif;
      font-size: 2.2vw;
      color: #ffffff;
      text-shadow: 0 0 10px var(--ts-pink);
    }

    /* ========================================================================
       [4. 하단 액션 버튼 바 (REPLAY / NEXT)]
       ======================================================================== */
    footer {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 1.2vw;
      padding: 1vh 3.5vw 2.5vh 3.5vw;
    }

    .game-btn {
      background: var(--ts-black);
      color: #ffffff;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.1vw;
      font-weight: 900;
      font-style: italic;
      padding: 1.1vh 2.6vw;
      border: 3px solid #ffffff;
      transform: skewX(var(--skew-deg));
      cursor: pointer;
      box-shadow: 5px 5px 0px rgba(0, 0, 0, 0.35);
      transition: all 0.2s;
      letter-spacing: 0.1em;
    }
    .game-btn:hover {
      background: var(--ts-yellow);
      color: var(--ts-black);
      border-color: var(--ts-black);
      transform: skewX(var(--skew-deg)) translateY(-3px);
      box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.4);
    }

    .game-btn.primary {
      background: var(--ts-pink);
      border-color: #ffffff;
      color: #ffffff;
    }
    .game-btn.primary:hover {
      background: #ffffff;
      color: var(--ts-pink);
      border-color: var(--ts-pink);
    }

    .replay-dock {
      position: absolute;
      bottom: 2.5vh;
      left: 3.5vw;
      display: flex;
      align-items: center;
      gap: 1vw;
    }
    .replay-dock button {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(0, 0, 0, 0.4);
      color: var(--ts-yellow);
      font-weight: 800;
      padding: 0.6vh 1.2vw;
      border-radius: 4px;
      font-size: 0.8vw;
      cursor: pointer;
    }

    .fs-toggle {
      position: absolute;
      top: 2.2vh;
      right: 1.5vw;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--ts-black);
      color: var(--ts-yellow);
      font-weight: 900;
      padding: 0.4vh 0.8vw;
      border-radius: 4px;
      font-size: 0.75vw;
      cursor: pointer;
      z-index: 50;
    }
  </style>
</head>
<body>

  <button class="fs-toggle" onclick="toggleFullScreen()">⛶ F11 전체화면</button>

  <div id="screen-viewport">
    
    <!-- 1. 배경 그래픽 -->
    <div class="bg-stripes"></div>
    <div class="bg-black-cut"></div>
    <canvas id="fx-canvas"></canvas>

    <!-- 2. 상단 헤더 -->
    <header>
      <div class="header-left">
        <div class="result-badge">
          <span>RESULT</span>
        </div>
        <div class="song-title-group">
          <h1>Beat U Down</h1>
          <p>ARTIST: MAKOU · BPM: 138</p>
        </div>
      </div>

      <div class="header-right">
        <span class="diff-pill">NORMAL</span>
        <span class="level-pill">LV. 06</span>
      </div>
    </header>

    <!-- 3. 메인 결과 화면 -->
    <main>
      <!-- [좌측: 앨범 재킷 & 도장] -->
      <div class="jacket-container">
        <div class="jacket-card" id="jacket">
          <div class="jacket-art">
            <div class="art-circle">
              <div class="art-core"></div>
            </div>
            <div class="art-title">BEAT U DOWN</div>
          </div>
        </div>
        <!-- PERFECT PLAY 도장 -->
        <div class="stamp-perfect-play" id="stamp-perfect">PERFECT PLAY</div>
      </div>

      <!-- [우측: 스코어 및 판정 데이터] -->
      <div class="result-data-panel">
        
        <!-- 랭크 S+ 및 점수 -->
        <div class="rank-and-score-row">
          <div class="rank-emblem-box" id="rank-box">
            <div class="rank-text" id="rank-val">S+</div>
          </div>
          <div class="score-block">
            <span class="score-title-tag">FINAL SCORE</span>
            <div class="digital-score" id="score-text">0,000,000</div>
          </div>
        </div>

        <!-- 세부 판정 게이지 -->
        <div class="judgment-breakdown">
          
          <div class="judge-row">
            <span class="judge-name p-plus">PERFECT+</span>
            <div class="judge-bar-track">
              <div class="judge-bar-fill fill-p-plus" id="bar-p-plus"></div>
            </div>
            <span class="judge-count" id="cnt-p-plus">0</span>
          </div>

          <div class="judge-row">
            <span class="judge-name p">PERFECT</span>
            <div class="judge-bar-track">
              <div class="judge-bar-fill fill-p" id="bar-p"></div>
            </div>
            <span class="judge-count" id="cnt-p">0</span>
          </div>

          <div class="judge-row">
            <span class="judge-name g">GOOD</span>
            <div class="judge-bar-track">
              <div class="judge-bar-fill fill-g" id="bar-g"></div>
            </div>
            <span class="judge-count">0</span>
          </div>

          <div class="judge-row">
            <span class="judge-name m">MISS</span>
            <div class="judge-bar-track">
              <div class="judge-bar-fill fill-m" id="bar-m"></div>
            </div>
            <span class="judge-count">0</span>
          </div>

          <div class="combo-row">
            <span>MAX COMBO</span>
            <span class="combo-count" id="cnt-combo">0</span>
          </div>

        </div>

      </div>
    </main>

    <!-- 4. 하단 버튼 바 -->
    <footer>
      <div class="replay-dock">
        <button onclick="playResultAnimation()">↺ 연출 다시보기</button>
      </div>

      <button class="game-btn">REPLAY</button>
      <button class="game-btn primary">NEXT STAGE ▶</button>
    </footer>

  </div>

  <script>
    /* =====================================================================
       [1. 다이아몬드 샤드 파티클]
       ===================================================================== */
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let shards = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Shard {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 14 + 6;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.size = Math.random() * 16 + 5;
        this.angle = Math.random() * Math.PI;
        this.rotSpeed = (Math.random() - 0.5) * 0.25;
        this.alpha = 1;
        this.decay = Math.random() * 0.025 + 0.015;
        this.color = color || '#00e5ff';
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.94;
        this.vy *= 0.94;
        this.angle += this.rotSpeed;
        this.alpha -= this.decay;
        return this.alpha > 0;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.moveTo(0, -this.size);
        ctx.lineTo(this.size * 0.7, 0);
        ctx.lineTo(0, this.size);
        ctx.lineTo(-this.size * 0.7, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    function burstShards(x, y, count = 70, color = '#ff135d') {
      for (let i = 0; i < count; i++) {
        shards.push(new Shard(x, y, color));
      }
    }

    function renderLoop() {
      ctx.clearRect(0, 0, width, height);
      shards = shards.filter(s => {
        const alive = s.update();
        if (alive) s.draw();
        return alive;
      });
      requestAnimationFrame(renderLoop);
    }
    renderLoop();

    function stageShake(power = 15) {
      gsap.fromTo('#screen-viewport', 
        { x: (Math.random() - 0.5) * power, y: (Math.random() - 0.5) * power },
        { x: 0, y: 0, duration: 0.3, ease: "elastic.out(1, 0.3)" }
      );
    }

    /* =====================================================================
       [2. 탭소닉 탑 클리어 결과창 정밀 모션그래픽 시퀀스]
       ===================================================================== */
    const tl = gsap.timeline();

    function playResultAnimation() {
      tl.clear();

      // 초기화
      gsap.set(['header', 'main', 'footer'], { opacity: 0 });
      gsap.set('#jacket', { scale: 0.8, rotateY: 45, opacity: 0 });
      gsap.set('#stamp-perfect', { scale: 0, opacity: 0 });
      gsap.set('#rank-box', { scale: 5, opacity: 0, rotate: -30 });
      gsap.set(['#bar-p-plus', '#bar-p'], { width: "0%" });
      document.getElementById('score-text').innerText = "0,000,000";
      document.getElementById('cnt-p-plus').innerText = "0";
      document.getElementById('cnt-p').innerText = "0";
      document.getElementById('cnt-combo').innerText = "0";

      // 1. 전체 화면 인트로 페이드인 & 앨범 재킷 슬램
      tl.to(['header', 'main', 'footer'], { opacity: 1, duration: 0.4 })
        .to('#jacket', { 
          scale: 1, 
          rotateY: -6, 
          opacity: 1, 
          duration: 0.7, 
          ease: "power4.out",
          onComplete: () => {
            stageShake(12);
            burstShards(window.innerWidth * 0.22, window.innerHeight * 0.5, 40, '#00e5ff');
          }
        }, "-=0.2")

        // 2. 판정 게이지 카운팅 (차례대로 바가 차오름)
        .to('#bar-p-plus', { width: "88%", duration: 0.8, ease: "power2.out" }, "-=0.2")
        .to('#cnt-p-plus', { 
          innerText: 486, 
          duration: 0.8, 
          snap: { innerText: 1 }, 
          ease: "power2.out" 
        }, "<")
        
        .to('#bar-p', { width: "12%", duration: 0.5, ease: "power2.out" }, "-=0.4")
        .to('#cnt-p', { 
          innerText: 34, 
          duration: 0.5, 
          snap: { innerText: 1 }, 
          ease: "power2.out" 
        }, "<")

        .to('#cnt-combo', { 
          innerText: 520, 
          duration: 0.8, 
          snap: { innerText: 1 }, 
          ease: "back.out(2)" 
        }, "-=0.3")

        // 3. 점수 롤링 (0 -> 1,284,520)
        .to({ val: 0 }, {
          val: 1284520,
          duration: 1.2,
          ease: "power3.out",
          onUpdate: function() {
            const num = Math.floor(this.targets()[0].val);
            document.getElementById('score-text').innerText = num.toLocaleString();
          }
        }, "-=0.6")

        // 4. 랭크 S+ 엠블럼 쾅 찍히기!
        .to('#rank-box', {
          scale: 1,
          opacity: 1,
          rotate: 0,
          duration: 0.5,
          ease: "power4.in",
          onComplete: () => {
            stageShake(24);
            burstShards(window.innerWidth * 0.45, window.innerHeight * 0.32, 80, '#ffdb00');
          }
        }, "-=0.5")

        // 5. PERFECT PLAY 대각선 도장 쾅!
        .to('#stamp-perfect', {
          scale: 1,
          opacity: 1,
          rotate: -18,
          duration: 0.4,
          ease: "back.out(2.5)",
          onComplete: () => {
            stageShake(20);
            burstShards(window.innerWidth * 0.22, window.innerHeight * 0.5, 90, '#ff135d');
          }
        }, "+=0.2");
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      playResultAnimation();
    });
  </script>
</body>
</html>
